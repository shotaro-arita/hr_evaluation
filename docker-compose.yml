services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hr_eval
      POSTGRES_USER: hr_eval
      POSTGRES_PASSWORD: hr_eval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://hr_eval:hr_eval@db:5432/hr_eval
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app

  worker:
    build: ./backend
    command: celery -A config worker -l INFO
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://hr_eval:hr_eval@db:5432/hr_eval
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  beat:
    build: ./backend
    command: celery -A config beat -l INFO
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://hr_eval:hr_eval@db:5432/hr_eval
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
